services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.server
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - mathmagic-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.client
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - server
    networks:
      - mathmagic-net

networks:
  mathmagic-net:
    driver: bridge
